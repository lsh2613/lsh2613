env:
  TIMEZONE: Asia/Seoul                  # 시간대 (기본: Asia/Seoul)
  ALL_COMMITS: 'true'                   # true: 전체 커밋 수 / false: 최근 1년
  K_FORMAT: 'false'                     # true: 1.5k 형식 / false: 1,500 형식
  OUTPUT_SVG: 'true'                    # true: README에 임베드할 SVG도 output/에 생성
  OUTPUT_DIR: 'output'                  # SVG 출력 디렉터리
